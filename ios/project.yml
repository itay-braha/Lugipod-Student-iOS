# XcodeGen spec. Generate the Xcode project with:  cd ios && xcodegen
name: LugipodStudent
options:
  bundleIdPrefix: com.itaybraha
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: he

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.3
  Daily:
    url: https://github.com/daily-co/daily-client-ios
    exactVersion: 0.41.0

targets:
  LugipodStudent:
    type: application
    platform: iOS
    sources:
      - path: LugipodStudent
        excludes:
          - "PrivacyInfo.xcprivacy"
      # Privacy manifest (required for App Store / TestFlight uploads).
      - path: LugipodStudent/PrivacyInfo.xcprivacy
        buildPhase: resources
      # KaTeX (math in Lugichat answers), copied into the app as a folder so its relative font paths keep working.
      - path: Resources/katex
        type: folder
        buildPhase: resources
    configFiles:
      Debug: Config/LugipodStudent.xcconfig
      Release: Config/LugipodStudent.xcconfig
    dependencies:
      - package: Supabase
        product: Supabase
      - package: Daily
        product: Daily
    entitlements:
      path: LugipodStudent/LugipodStudent.entitlements
      properties:
        aps-environment: production
        com.apple.developer.associated-domains: [applinks:lugipod.com]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itaybraha.lugipod
        PRODUCT_NAME: LugipodStudent
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: LugipodStudent/Info.plist
      properties:
        CFBundleDisplayName: לוגיפוד
        CFBundleDevelopmentRegion: he
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # The lesson's voice keeps going with the screen locked or another app in front.
        UIBackgroundModes: [audio]
        UIAppFonts: [Heebo.ttf]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: צילום שאלה ללוגיצ׳אט, והצגת המצלמה שלך בשיעור.
        NSMicrophoneUsageDescription: כדי שהמורה והחברים לקבוצה ישמעו אותך בשיעור.
        NSPhotoLibraryUsageDescription: בחירת תמונה של שאלה מהגלריה.
        LugipodBaseURL: $(LUGIPOD_BASE_URL)
        LugipodSupabaseHost: $(SUPABASE_PROJECT_HOST)
        LugipodSupabaseKey: $(SUPABASE_PUBLISHABLE_KEY)

  LugipodStudentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LugipodStudentTests
    dependencies:
      - target: LugipodStudent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itaybraha.lugipod.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/LugipodStudent.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/LugipodStudent

schemes:
  LugipodStudent:
    build:
      targets:
        LugipodStudent: all
        LugipodStudentTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LugipodStudentTests
