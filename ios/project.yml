# XcodeGen spec. Generate the Xcode project with:  cd ios && xcodegen
name: LugipodStudent
options:
  bundleIdPrefix: com.itaybraha
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: he

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.3
  Daily:
    url: https://github.com/daily-co/daily-client-ios
    exactVersion: 0.41.0

targets:
  LugipodStudent:
    type: application
    platform: iOS
    sources:
      - path: LugipodStudent
        excludes:
          - "PrivacyInfo.xcprivacy"
      # Privacy manifest (required for App Store / TestFlight uploads).
      - path: LugipodStudent/PrivacyInfo.xcprivacy
        buildPhase: resources
      # KaTeX (math in Lugichat answers), copied into the app as a folder so its relative font paths keep working.
      - path: Resources/katex
        type: folder
        buildPhase: resources
      # The keychain bridge shared with the Share extension (the share token and the "open this conversation" request).
      - path: Shared
    configFiles:
      Debug: Config/LugipodStudent.xcconfig
      Release: Config/LugipodStudent.xcconfig
    dependencies:
      - package: Supabase
        product: Supabase
      - package: Daily
        product: Daily
      # "Share → לוגיפוד": send a picture from any app to a Lugichat conversation or to a teacher.
      - target: LugipodShare
    entitlements:
      path: LugipodStudent/LugipodStudent.entitlements
      properties:
        aps-environment: production
        com.apple.developer.associated-domains: [applinks:lugipod.com]
        # The app's own group stays first (the Supabase session keeps living in it); the shared group is for the Share extension only.
        keychain-access-groups: [$(AppIdentifierPrefix)com.itaybraha.lugipod, $(AppIdentifierPrefix)com.itaybraha.lugipod.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itaybraha.lugipod
        PRODUCT_NAME: LugipodStudent
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: LugipodStudent/Info.plist
      properties:
        CFBundleDisplayName: לוגיפוד
        CFBundleDevelopmentRegion: he
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # The lesson's voice keeps going with the screen locked or another app in front.
        UIBackgroundModes: [audio]
        UIAppFonts: [Heebo.ttf]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: צילום שאלה ללוגיצ׳אט, והצגת המצלמה שלך בשיעור.
        NSMicrophoneUsageDescription: כדי שהמורה והחברים לקבוצה ישמעו אותך בשיעור.
        NSPhotoLibraryUsageDescription: בחירת תמונה של שאלה מהגלריה.
        LugipodBaseURL: $(LUGIPOD_BASE_URL)
        LugipodSupabaseHost: $(SUPABASE_PROJECT_HOST)
        LugipodSupabaseKey: $(SUPABASE_PUBLISHABLE_KEY)
        LugipodKeychainGroup: $(AppIdentifierPrefix)com.itaybraha.lugipod.shared

  # "Share → לוגיפוד" (WhatsApp, Photos, Safari...): a picture to a Lugichat conversation or a pre-lesson question.
  LugipodShare:
    type: app-extension
    platform: iOS
    sources:
      - path: LugipodShare
        excludes:
          - "PrivacyInfo.xcprivacy"
      - path: LugipodShare/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared
    configFiles:
      Debug: Config/LugipodStudent.xcconfig
      Release: Config/LugipodStudent.xcconfig
    entitlements:
      path: LugipodShare/LugipodShare.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)com.itaybraha.lugipod.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itaybraha.lugipod.share
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: LugipodShare/Info.plist
      properties:
        CFBundleDisplayName: לוגיפוד
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LugipodBaseURL: $(LUGIPOD_BASE_URL)
        LugipodKeychainGroup: $(AppIdentifierPrefix)com.itaybraha.lugipod.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Any shared item that is, or contains, a picture (a photo, several photos, a screenshot, a file that is an image).
            NSExtensionActivationRule: >-
              SUBQUERY (extensionItems, $extensionItem, SUBQUERY ($extensionItem.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image").@count >= 1).@count >= 1

  LugipodStudentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LugipodStudentTests
    dependencies:
      - target: LugipodStudent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itaybraha.lugipod.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/LugipodStudent.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/LugipodStudent

  LugipodStudentUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LugipodStudentUITests
    dependencies:
      - target: LugipodStudent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itaybraha.lugipod.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LugipodStudent

schemes:
  LugipodStudentUI:
    build:
      targets:
        LugipodStudent: all
        LugipodStudentUITests: [test]
    test:
      config: Debug
      targets:
        - LugipodStudentUITests
  LugipodStudent:
    build:
      targets:
        LugipodStudent: all
        LugipodStudentTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LugipodStudentTests
